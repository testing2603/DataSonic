# Report plan for scripts/pbir_build.py. Approved spec: _brief/report-spec.md
name: Marine Claims Overview
model: {workspace: DataSonic 3, name: Marine_Gold_Model, id: dcd787e0-dd7d-47fd-bb3d-af3669727011}

report_measures:
  - {table: Claim Vessels, name: Claims, type: Integer, format: "#,##0", dax: "DISTINCTCOUNT('Claim Vessels'[Claim Number])"}
  - {table: Claim Vessels, name: Open Claims, type: Integer, format: "#,##0",
     dax: "CALCULATE(DISTINCTCOUNT('Claim Vessels'[Claim Number]), 'Claim'[Is Open Claim] = TRUE())"}
  - {table: Claim Vessels, name: Incurred (m), format: "#,##0.0", dax: "DIVIDE([Total Incurred], 1000000)"}
  - {table: Claim Vessels, name: Outstanding (m), format: "#,##0.0", dax: "DIVIDE([Total Outstanding], 1000000)"}

pages:
  - name: Claims overview
    title: "Hull & Machinery carries the largest share of outstanding claims"
    subtitle: "Marine claims \xB7 amounts in the selected currency (no FX) \xB7 loss years up to 2026 (future loss dates excluded)"
    filters:
      - {field: "Date[Year]", op: "<=", value: 2026}
    regions:
      header: [1, 1, 9, 2]
      filters: [9, 1, 13, 2]
      kpis: [1, 2, 9, 4]
      filters2: [9, 2, 13, 3]
      trend: [1, 4, 7, 9]
      products: [7, 4, 13, 9]
      brokers: [1, 9, 13, 13]
    visuals:
      - {kind: slicer, id: currency, region: filters, slot: 1, of: 3, field: "Claim Vessels[Claim Currency]", label: Currency, single: true, default: GBP}
      - {kind: slicer, id: year, region: filters, slot: 2, of: 3, field: "Date[Year]", label: Loss year}
      - {kind: slicer, id: product, region: filters, slot: 3, of: 3, field: "Policy[Product]", label: Product}
      - {kind: slicer, id: claim_status, region: filters2, slot: 1, of: 1, field: "Claim[Claim Status]", label: Claim status}
      - kind: card
        id: kpis
        region: kpis
        accent: "Claim Vessels[Total Outstanding]"
        alt: "Six headline claims KPIs: claims, open claims, incurred, paid, outstanding and payment ratio, in the selected currency."
        values:
          - {field: "Claim Vessels[Claims]", label: Claims, exact: true}
          - {field: "Claim Vessels[Open Claims]", label: Open claims, exact: true}
          - {field: "Claim Vessels[Total Incurred]", label: Incurred}
          - {field: "Claim Vessels[Total Paid]", label: Paid}
          - {field: "Claim Vessels[Total Outstanding]", label: Outstanding}
          - {field: "Claim Vessels[Claim Payment Ratio (%)]", label: Payment ratio}
      - kind: line
        id: trend
        region: trend
        title: Incurred, paid and outstanding by loss year
        alt: "Line chart of incurred, paid and outstanding by loss year; paid falls close to zero for losses from 2024 onward."
        category: "Date[Year]"
        category_label: Loss year
        sort: category_asc
        values:
          - {field: "Claim Vessels[Total Incurred]", label: Incurred}
          - {field: "Claim Vessels[Total Paid]", label: Paid}
          - {field: "Claim Vessels[Total Outstanding]", label: Outstanding}
      - kind: bar
        id: products
        region: products
        title: Outstanding by product (highest first)
        alt: "Bar chart of outstanding by product, largest first; Hull & Machinery leads at GBP 7.9bn."
        category: "Policy[Product]"
        values: [{field: "Claim Vessels[Total Outstanding]", label: Outstanding}]
        sort: value_desc
      - kind: matrix
        id: brokers
        region: brokers
        title: Brokers by outstanding (highest first)
        alt: "Table of brokers sorted by outstanding, with claims, incurred and outstanding in millions, and payment ratio."
        rows: [{field: "Broker[Broker Name]", label: Broker}]
        sort_by: "Claim Vessels[Outstanding (m)]"
        values:
          - {field: "Claim Vessels[Claims]", label: Claims}
          - {field: "Claim Vessels[Incurred (m)]", label: "Incurred (m)"}
          - {field: "Claim Vessels[Outstanding (m)]", label: "Outstanding (m)"}
          - {field: "Claim Vessels[Claim Payment Ratio (%)]", label: Payment ratio}
