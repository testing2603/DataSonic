# Report plan for scripts/pbir_build.py. Approved spec: _brief/report-spec.md
name: Marine Broker and Risk Review
model: {workspace: DataSonic 3, name: Marine_Gold_Model, id: dcd787e0-dd7d-47fd-bb3d-af3669727011}

report_measures:
  # Counts through the claims fact so the slicers apply
  - {table: Claim Vessels, name: Claims, type: Integer, format: "#,##0", dax: "DISTINCTCOUNT('Claim Vessels'[Claim Number])"}
  - {table: Claim Vessels, name: Brokers with Claims, type: Integer, format: "#,##0",
     dax: "CALCULATE(DISTINCTCOUNT('Claim Vessels'[Broker Key]), 'Broker'[Broker ID] <> \"UNKNOWN\")"}
  - {table: Claim Vessels, name: Reopened Claims, type: Integer, format: "#,##0",
     dax: "CALCULATE(DISTINCTCOUNT('Claim Vessels'[Claim Number]), 'Claim'[Is Reopened Claim] = TRUE())"}
  - {table: Claim Vessels, name: GA Declared Claims, type: Integer, format: "#,##0",
     dax: "CALCULATE(DISTINCTCOUNT('Claim Vessels'[Claim Number]), 'Claim'[General Average Declared] = TRUE())"}
  - {table: Claim Vessels, name: Incurred (m), format: "#,##0.0", dax: "DIVIDE([Total Incurred], 1000000)"}
  - {table: Claim Vessels, name: OS Reserve (m), format: "#,##0.0", dax: "DIVIDE([Total Outstanding], 1000000)"}
  - {table: Claim Vessels, name: Reporting Lag (days), format: "#,##0.0", dax: "[Average Claim Reporting Lag (Days)]"}
  # Does delegated authority / commission make a difference? (payment ratio per segment)
  - {table: Claim Vessels, name: Payment Ratio DA, format: "0.0%", dax: "CALCULATE([Claim Payment Ratio (%)], 'Broker'[Delegated Authority] = TRUE())"}
  - {table: Claim Vessels, name: Payment Ratio Non-DA, format: "0.0%", dax: "CALCULATE([Claim Payment Ratio (%)], 'Broker'[Delegated Authority] = FALSE())"}
  - {table: Claim Vessels, name: Payment Ratio Low Commission, format: "0.0%", dax: "CALCULATE([Claim Payment Ratio (%)], 'Broker'[Commission %] < 0.035)"}
  - {table: Claim Vessels, name: Payment Ratio Mid Commission, format: "0.0%", dax: "CALCULATE([Claim Payment Ratio (%)], 'Broker'[Commission %] >= 0.035, 'Broker'[Commission %] < 0.07)"}
  - {table: Claim Vessels, name: Payment Ratio High Commission, format: "0.0%", dax: "CALCULATE([Claim Payment Ratio (%)], 'Broker'[Commission %] >= 0.07)"}
  # Broker attributes for the table (blank when the broker has no claims in context, so only brokers with claims list)
  - {table: Claim Vessels, name: FCA Number, type: Text, format: "", dax: "IF([Claims] > 0, SELECTEDVALUE('Broker'[FCA Registration Number]))"}
  - {table: Claim Vessels, name: Onboarded, type: Text, format: "", dax: "IF([Claims] > 0, FORMAT(SELECTEDVALUE('Broker'[Date of Onboarding]), \"dd mmm yyyy\"))"}
  - {table: Claim Vessels, name: Broker Type Label, type: Text, format: "", dax: "IF([Claims] > 0, SELECTEDVALUE('Broker'[Broker Type]))"}
  - {table: Claim Vessels, name: Commission, format: "0.00%", dax: "IF([Claims] > 0, SELECTEDVALUE('Broker'[Commission %]))"}
  - {table: Claim Vessels, name: Delegated Authority Label, type: Text, format: "",
     dax: "IF([Claims] > 0 && HASONEVALUE('Broker'[Delegated Authority]), IF(SELECTEDVALUE('Broker'[Delegated Authority]), \"Yes\", \"No\"))"}

colors:
  Payment Ratio DA: "#0891B2"
  Payment Ratio Non-DA: "#94A3B8"
  Payment Ratio Low Commission: "#CBD5E1"
  Payment Ratio Mid Commission: "#64748B"
  Payment Ratio High Commission: "#1E293B"
  Reopened Claims: "#0891B2"
  GA Declared Claims: "#1E293B"

pages:
  - name: Broker performance
    title: Coverholders with delegated authority have paid only 29% of incurred; broker type alone barely matters
    subtitle: "Marine claims in the selected currency (no FX) · payment ratio = paid ÷ incurred · commission bands: under 3.5%, 3.5–7%, 7% and over · loss years up to 2026"
    filters:
      - {field: "Date[Year]", op: "<=", value: 2026}
    regions:
      header: [1, 1, 9, 2]
      filters: [9, 1, 13, 2]
      kpis: [1, 2, 13, 4]
      da: [1, 4, 7, 8]
      commission: [7, 4, 13, 8]
      brokers: [1, 8, 13, 13]
    visuals:
      - {kind: slicer, id: currency, region: filters, slot: 1, of: 3, field: "Claim Vessels[Claim Currency]", label: Currency, single: true, default: GBP}
      - {kind: slicer, id: broker_type, region: filters, slot: 2, of: 3, field: "Broker[Broker Type]", label: Broker type}
      - {kind: slicer, id: product, region: filters, slot: 3, of: 3, field: "Policy[Product]", label: Product}
      - kind: card
        id: kpis
        region: kpis
        accent: "Claim Vessels[Total Outstanding]"
        alt: "Five headline KPIs: brokers with claims, claims, incurred, OS reserve and payment ratio, in the selected currency."
        values:
          - {field: "Claim Vessels[Brokers with Claims]", label: Brokers with claims, exact: true}
          - {field: "Claim Vessels[Claims]", label: Claims, exact: true}
          - {field: "Claim Vessels[Total Incurred]", label: Incurred}
          - {field: "Claim Vessels[Total Outstanding]", label: OS reserve}
          - {field: "Claim Vessels[Claim Payment Ratio (%)]", label: Payment ratio}
      - kind: clustered_column
        id: pr_by_type_da
        region: da
        title: Payment ratio by broker type, with vs without delegated authority
        alt: "Clustered column chart of payment ratio by broker type, split into brokers with and without delegated authority; coverholders with delegated authority are lowest at about 29%."
        category: "Broker[Broker Type]"
        category_label: Broker type
        sort: category_asc
        values:
          - {field: "Claim Vessels[Payment Ratio DA]", label: Delegated authority}
          - {field: "Claim Vessels[Payment Ratio Non-DA]", label: No delegated authority}
      - kind: clustered_column
        id: pr_by_type_commission
        region: commission
        title: Payment ratio by broker type and commission band
        alt: "Clustered column chart of payment ratio by broker type for three commission bands: under 3.5%, 3.5 to 7%, and 7% and over; no band is consistently higher or lower."
        category: "Broker[Broker Type]"
        category_label: Broker type
        sort: category_asc
        values:
          - {field: "Claim Vessels[Payment Ratio Low Commission]", label: Under 3.5%}
          - {field: "Claim Vessels[Payment Ratio Mid Commission]", label: 3.5–7%}
          - {field: "Claim Vessels[Payment Ratio High Commission]", label: 7% and over}
      - kind: matrix
        id: brokers
        region: brokers
        title: Brokers by incurred (highest first)
        alt: "Table of brokers with claims, sorted by incurred, with FCA number, onboarding date, type, commission, delegated authority, claims, incurred and OS reserve in millions, and payment ratio."
        rows: [{field: "Broker[Broker Name]", label: Broker}]
        sort_by: "Claim Vessels[Incurred (m)]"
        values:
          - {field: "Claim Vessels[FCA Number]", label: FCA no.}
          - {field: "Claim Vessels[Onboarded]", label: Onboarded}
          - {field: "Claim Vessels[Broker Type Label]", label: Type}
          - {field: "Claim Vessels[Commission]", label: Commission}
          - {field: "Claim Vessels[Delegated Authority Label]", label: Delegated authority}
          - {field: "Claim Vessels[Claims]", label: Claims}
          - {field: "Claim Vessels[Incurred (m)]", label: Incurred (m)}
          - {field: "Claim Vessels[OS Reserve (m)]", label: OS reserve (m)}
          - {field: "Claim Vessels[Claim Payment Ratio (%)]", label: Payment ratio}

  - name: Vessel risk & settlements
    title: Container ships carry the most incurred, and more than a quarter of claims have been reopened
    subtitle: "Claims in the claim currency, settlements in the settlement currency (no FX) · vessel type from claims (13 claims with no type excluded) · loss and settlement dates up to 2026 · net claim cost is not available in the model"
    filters:
      - {field: "Date[Year]", op: "<=", value: 2026}
    regions:
      header: [1, 1, 9, 2]
      filters: [9, 1, 13, 2]
      kpis: [1, 2, 13, 4]
      vessels: [1, 4, 7, 8]
      flag_incurred: [7, 4, 13, 8]
      settlements: [1, 8, 7, 13]
      flag_claims: [7, 8, 13, 13]
    visuals:
      - {kind: slicer, id: claim_currency, region: filters, slot: 1, of: 2, field: "Claim Vessels[Claim Currency]", label: Claim currency, single: true, default: GBP}
      - {kind: slicer, id: settlement_currency, region: filters, slot: 2, of: 2, field: "Claim Settlement Transactions[Settlement Currency]", label: Settlement currency, single: true, default: GBP}
      - kind: card
        id: kpis
        region: kpis
        accent: "Claim Vessels[Total Incurred]"
        alt: "Six headline KPIs: claims, reopened claims, claims with General Average declared, incurred, settlements paid and average reporting lag."
        values:
          - {field: "Claim Vessels[Claims]", label: Claims, exact: true}
          - {field: "Claim Vessels[Reopened Claims]", label: Reopened, exact: true}
          - {field: "Claim Vessels[GA Declared Claims]", label: General Average declared, exact: true}
          - {field: "Claim Vessels[Total Incurred]", label: Incurred}
          - {field: "Claim Settlement Transactions[Total Settlements]", label: Settlements paid}
          - {field: "Claim Vessels[Reporting Lag (days)]", label: Avg days to notify}
      - kind: matrix
        id: vessels
        region: vessels
        title: Vessel types by incurred (highest first)
        alt: "Table of vessel types sorted by incurred, with claims, incurred in millions, reopened claims, General Average claims and average days to notify; container ships lead."
        rows: [{field: "Vessel[Vessel Type]", label: Vessel type}]
        sort_by: "Claim Vessels[Incurred (m)]"
        filters: [{field: "Vessel[IMO Number]", op: "<>", value: "UNKNOWN"}]
        values:
          - {field: "Claim Vessels[Claims]", label: Claims}
          - {field: "Claim Vessels[Incurred (m)]", label: Incurred (m)}
          - {field: "Claim Vessels[Reopened Claims]", label: Reopened}
          - {field: "Claim Vessels[GA Declared Claims]", label: GA declared}
          - {field: "Claim Vessels[Reporting Lag (days)]", label: Avg days to notify}
      - kind: column
        id: flag_incurred
        region: flag_incurred
        title: Incurred by flag state (highest first)
        alt: "Column chart of incurred by flag state, largest first; Marshall Islands (MH) is largest."
        category: "Policy[Flag State Country Code]"
        category_label: Flag state
        values: [{field: "Claim Vessels[Total Incurred]", label: Incurred}]
      - kind: clustered_column
        id: settlements
        region: settlements
        title: Settlements paid per quarter, 2023–2026
        alt: "Clustered column chart of settlement amounts by quarter, one column per year from 2023 to 2026, by last transaction date."
        category: "Date[Quarter]"
        category_label: Quarter
        series: "Date[Year]"
        series_label: Year
        sort: category_asc
        filters: [{field: "Date[Year]", op: ">=", value: 2023}]
        values: [{field: "Claim Settlement Transactions[Total Settlements]", label: Settled}]
      - kind: clustered_column
        id: flag_claims
        region: flag_claims
        title: Reopened and General Average claims by flag state (most reopened first)
        alt: "Clustered column chart of reopened claims and General Average declared claims by flag state, sorted by reopened claims."
        category: "Policy[Flag State Country Code]"
        category_label: Flag state
        sort_by: "Claim Vessels[Reopened Claims]"
        values:
          - {field: "Claim Vessels[Reopened Claims]", label: Reopened}
          - {field: "Claim Vessels[GA Declared Claims]", label: GA declared}
