# Report plan for scripts/pbir_build.py. Approved spec: _brief/report-spec.md
name: Marine Claims Management
model: {workspace: DataSonic 3, name: Marine_Gold_Model, id: dcd787e0-dd7d-47fd-bb3d-af3669727011}

report_measures:
  - {table: Claim Vessels, name: Claims, type: Integer, format: "#,##0", dax: "DISTINCTCOUNT('Claim Vessels'[Claim Number])"}
  - {table: Claim Vessels, name: Open Claims, type: Integer, format: "#,##0",
     dax: "CALCULATE(DISTINCTCOUNT('Claim Vessels'[Claim Number]), 'Claim'[Is Open Claim] = TRUE())"}
  - {table: Claim Vessels, name: Reopened Claims, type: Integer, format: "#,##0",
     dax: "CALCULATE(DISTINCTCOUNT('Claim Vessels'[Claim Number]), 'Claim'[Is Reopened Claim] = TRUE())"}
  - {table: Claim Vessels, name: GA Claims, type: Integer, format: "#,##0",
     dax: "CALCULATE(DISTINCTCOUNT('Claim Vessels'[Claim Number]), 'Claim'[General Average Declared] = TRUE())"}
  # Notified by quarter: dated by Notification Date, with the year fixed, so the Loss year slicer doesn't apply
  - {table: Claim Vessels, name: Notified 2024, type: Integer, format: "#,##0",
     dax: "CALCULATE(DISTINCTCOUNT('Claim Vessels'[Claim Number]), USERELATIONSHIP('Claim Vessels'[Notification Date Key], 'Date'[Date Key]), 'Date'[Year] = 2024)"}
  - {table: Claim Vessels, name: Notified 2025, type: Integer, format: "#,##0",
     dax: "CALCULATE(DISTINCTCOUNT('Claim Vessels'[Claim Number]), USERELATIONSHIP('Claim Vessels'[Notification Date Key], 'Date'[Date Key]), 'Date'[Year] = 2025)"}
  - {table: Claim Vessels, name: Incurred (m), format: "#,##0.0", dax: "DIVIDE([Total Incurred], 1000000)"}
  - {table: Claim Vessels, name: OS Reserve (m), format: "#,##0.0", dax: "DIVIDE([Total Outstanding], 1000000)"}

colors:
  "OS Reserve (m)": "#0891B2"
  "Incurred (m)": "#1E293B"

pages:
  - name: Claims health
    title: 386 claims are still open, holding £24.0bn in OS reserve
    subtitle: "Marine claims · amounts in the selected currency (no FX) · loss years up to 2026 (future-dated losses excluded) · OS reserve = Outstanding"
    filters:
      - {field: "Date[Year]", op: "<=", value: 2026}
    regions:
      header: [1, 1, 9, 2]
      filters: [9, 1, 13, 2]
      kpis: [1, 2, 13, 4]
      trend: [1, 4, 13, 8]
      types: [1, 8, 7, 13]
      causes: [7, 8, 13, 13]
    visuals:
      - {kind: slicer, id: currency, region: filters, slot: 1, of: 3, field: "Claim Vessels[Claim Currency]", label: Currency, single: true, default: GBP}
      - {kind: slicer, id: year, region: filters, slot: 2, of: 3, field: "Date[Year]", label: Loss year}
      - {kind: slicer, id: product, region: filters, slot: 3, of: 3, field: "Policy[Product]", label: Product}
      - kind: card
        id: kpis
        region: kpis
        accent: "Claim Vessels[Total Outstanding]"
        alt: "Six headline KPIs: claims, open claims, reopened claims, incurred, paid and OS reserve, in the selected currency."
        values:
          - {field: "Claim Vessels[Claims]", label: Claims, exact: true}
          - {field: "Claim Vessels[Open Claims]", label: Open claims, exact: true}
          - {field: "Claim Vessels[Reopened Claims]", label: Reopened claims, exact: true}
          - {field: "Claim Vessels[Total Incurred]", label: Incurred}
          - {field: "Claim Vessels[Total Paid]", label: Paid}
          - {field: "Claim Vessels[Total Outstanding]", label: OS reserve}
      - kind: line
        id: notified
        region: trend
        title: Claims notified per quarter, 2024 vs 2025 (by notification date)
        alt: "Line chart of claims notified per quarter for 2024 and 2025; Q3 2025 is the peak at 87."
        category: "Date[Quarter]"
        category_label: Quarter
        sort: category_asc
        values:
          - {field: "Claim Vessels[Notified 2024]", label: "2024", color: "#94A3B8"}
          - {field: "Claim Vessels[Notified 2025]", label: "2025", color: "#1E293B"}
      - kind: bar
        id: types
        region: types
        title: Payment ratio by claim type
        alt: "Bar chart of payment ratio by claim type, highest first; constructive total loss is highest at about 50%."
        category: "Claim[Claim Type]"
        category_label: Claim type
        values: [{field: "Claim Vessels[Claim Payment Ratio (%)]", label: Payment ratio}]
      - kind: bar
        id: causes
        region: causes
        title: Average reporting lag (days) by cause of loss
        alt: "Bar chart of average days from loss to notification by cause of loss, longest first; jettison is longest at about 25 days."
        category: "Claim[Cause of Loss]"
        category_label: Cause of loss
        values: [{field: "Claim Vessels[Average Claim Reporting Lag (Days)]", label: Avg reporting lag (days)}]

  - name: Vessel and product exposure
    title: Hull & Machinery and container ships carry the largest OS reserve
    subtitle: "Marine claims · amounts in millions of the selected currency (no FX) · loss years up to 2026 · OS reserve = Outstanding"
    filters:
      - {field: "Date[Year]", op: "<=", value: 2026}
    regions:
      header: [1, 1, 9, 2]
      filters: [9, 1, 13, 2]
      vessels: [1, 2, 7, 7]
      products: [7, 2, 13, 7]
      brokers: [1, 7, 8, 13]
      ga: [8, 7, 13, 13]
    visuals:
      - {kind: slicer, id: currency, region: filters, slot: 1, of: 3, field: "Claim Vessels[Claim Currency]", label: Currency, single: true, default: GBP}
      - {kind: slicer, id: year, region: filters, slot: 2, of: 3, field: "Date[Year]", label: Loss year}
      - {kind: slicer, id: product, region: filters, slot: 3, of: 3, field: "Policy[Product]", label: Product}
      - kind: clustered_bar
        id: vessels
        region: vessels
        title: OS reserve and incurred by vessel type (m, highest first)
        alt: "Clustered bar chart of OS reserve and incurred in millions by vessel type, sorted by OS reserve; container ships are largest."
        category: "Vessel[Vessel Type]"
        category_label: Vessel type
        label_units: 1
        values:
          - {field: "Claim Vessels[OS Reserve (m)]", label: OS reserve (m)}
          - {field: "Claim Vessels[Incurred (m)]", label: Incurred (m)}
      - kind: clustered_bar
        id: products
        region: products
        title: OS reserve and incurred by product (m, highest first)
        alt: "Clustered bar chart of OS reserve and incurred in millions by product, sorted by OS reserve; Hull & Machinery is largest."
        category: "Policy[Product]"
        category_label: Product
        label_units: 1
        values:
          - {field: "Claim Vessels[OS Reserve (m)]", label: OS reserve (m)}
          - {field: "Claim Vessels[Incurred (m)]", label: Incurred (m)}
      - kind: matrix
        id: brokers
        region: brokers
        title: Brokers by OS reserve (highest first)
        alt: "Table of brokers sorted by OS reserve in millions, with claims, incurred and payment ratio."
        rows: [{field: "Broker[Broker Name]", label: Broker}]
        sort_by: "Claim Vessels[OS Reserve (m)]"
        values:
          - {field: "Claim Vessels[Claims]", label: Claims}
          - {field: "Claim Vessels[OS Reserve (m)]", label: OS reserve (m)}
          - {field: "Claim Vessels[Incurred (m)]", label: Incurred (m)}
          - {field: "Claim Vessels[Claim Payment Ratio (%)]", label: Payment ratio}
      - kind: column
        id: ga
        region: ga
        title: General average claims by loss year
        alt: "Column chart of claims with general average declared, by loss year 2020 to 2026; 2023 is highest at 54, and 2026 is a partial year."
        category: "Date[Year]"
        category_label: Loss year
        sort: category_asc
        values: [{field: "Claim Vessels[GA Claims]", label: GA claims}]
