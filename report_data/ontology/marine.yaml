# Generated by build_ontology.py from Marine_Gold_Model TMDL + ontology_review.xlsx. Don't hand-edit.
model:
  workspace: DataSonic 3
  workspace_id: 1296a62d-7e36-4481-a586-686e8d4b0ccc
  semantic_model: Marine_Gold_Model
  semantic_model_id: dcd787e0-dd7d-47fd-bb3d-af3669727011
  storage_mode: Direct Lake
  line_of_business: Marine
global_rules:
- id: CURRENCY
  rule: Money measures are BLANK unless exactly one currency is in context. There is no FX. Always group or filter by the
    fact's currency column for any money answer.
  currency_columns:
    Claim Vessels: Claim Currency
    Claim Settlement Transactions: Settlement Currency
    Policy Exposures: Currency
  exception: Total Insured Value (GBP) is always GBP and can be totalled.
- id: NO-SUM-RATIOS
  rule: Ratios and day counts (lag, duration) are never summed or averaged across rows; use the measure.
- id: UNKNOWN-MEMBER
  rule: Every dimension has an UNKNOWN row. Count measures exclude it; exclude it from lists too.
- id: DEFAULT-DATES
  rule: Claim questions use Loss Date; settlements use Last Transaction Date; policy questions use Insurance Period Start.
    Other date roles need the '(by …)' measures.
- id: EXPLICIT-MEASURES
  rule: The model discourages implicit measures. Use the listed measures; don't SUM columns directly.
- id: ASSUMPTIONS
  rule: When a term has status 'unconfirmed', state the assumption in the answer. When status is 'ask', ask the user before
    answering. When 'not_available', say so and don't approximate unless offered below.
date_roles:
  Claim Vessels:
    default: Loss Date
    others:
      Notification Date:
      - '# Claim Vessels (by Notification Date)'
      - Total Incurred (by Notification Date)
  Claim Settlement Transactions:
    default: Last Transaction Date
    others: {}
  Policy Exposures:
    default: Insurance Period Start
    others:
      Insurance Period End:
      - '# Policy Exposures (by Insurance Period End)'
      - Total Limit (by Insurance Period End)
      Policy Issue Date:
      - '# Policy Exposures (by Policy Issue Date)'
      - Total Limit (by Policy Issue Date)
terms:
