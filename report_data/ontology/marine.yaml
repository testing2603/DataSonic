tables:
  Broker:
    description: One row per broker_id (TOBA master, MAR2-14a) (G2), with an UNKNOWN member. gold.marine_dim_broker.
  Claim Settlement Transactions:
    description: 'Grain: One row per settlement movement (claim_number, last_transaction_date); imo_number splits multi-vessel
      groups. gold.marine_fact_claim_settlement_txn (G1).'
  Claim Vessels:
    description: 'Grain: One row per claim per vessel (claim_number, imo_number). gold.marine_fact_claim (G1). Rules: KPI-PAYMENT-RATIO,
      KPI-REPORTING-LAG, KPI-SETTLEMENT-RATIO, MAR2-09b.'
  Claim:
    description: One row per claim_number (G2), with an UNKNOWN member. gold.marine_dim_claim.
  Customer:
    description: One row per customer_id (executive from claims - S4) (G2), with an UNKNOWN member. gold.marine_dim_customer.
  Date:
    description: Role-playing calendar (G6); the UNKNOWN row holds missing dates. gold.marine_dim_date.
  Facility:
    description: One row per facility_id (G2), with an UNKNOWN member. gold.marine_dim_facility.
  Policy Exposures:
    description: 'Grain: One row per policy (policy_number). gold.marine_fact_policy (G1).'
  Policy:
    description: One row per policy_number (G2), with an UNKNOWN member. gold.marine_dim_policy.
  Vessel:
    description: 'One row per imo_number (conformed: claim + policy IMOs; vessel_type from claims only - S3) (G2), with an
      UNKNOWN member. gold.marine_dim_vessel.'
measures:
  '# Brokers':
    dax: CALCULATE(COUNTROWS('Broker'), 'Broker'[Broker ID] <> "UNKNOWN")
    description: Number of brokers, excluding the UNKNOWN member.
    formatString: '#,##0'
    displayFolder: Counts
    table: Broker
  '# Claim Settlement Transactions':
    dax: COUNTROWS('Claim Settlement Transactions')
    description: 'Rows of Claim Settlement Transactions. Grain: One row per settlement movement (claim_number, last_transaction_date);
      imo_number splits multi-vessel groups.'
    formatString: '#,##0'
    displayFolder: Counts
    table: Claim Settlement Transactions
  '# Currencies (Claim Settlement Transactions)':
    dax: COUNTROWS(VALUES('Claim Settlement Transactions'[Settlement Currency]))
    description: 'Currency check: claim_currency values in context. Money of Claim Settlement Transactions shows only when
      this is 1.'
    formatString: '#,##0'
    displayFolder: Checks
    table: Claim Settlement Transactions
  Total Settlements:
    dax: IF(COUNTROWS(VALUES('Claim Settlement Transactions'[Settlement Currency])) = 1, SUM('Claim Settlement Transactions'[Settlement
      Amount]))
    description: Sum of settlement_amount (ROW); blank unless one currency is in context; no FX.
    formatString: '#,##0.00'
    displayFolder: Amounts
    table: Claim Settlement Transactions
  '# Claim Vessels':
    dax: COUNTROWS('Claim Vessels')
    description: 'Rows of Claim Vessels. Grain: One row per claim per vessel (claim_number, imo_number).'
    formatString: '#,##0'
    displayFolder: Counts
    table: Claim Vessels
  '# Currencies (Claim Vessels)':
    dax: COUNTROWS(VALUES('Claim Vessels'[Claim Currency]))
    description: 'Currency check: claim_currency values in context. Money of Claim Vessels shows only when this is 1.'
    formatString: '#,##0'
    displayFolder: Checks
    table: Claim Vessels
  Total Incurred:
    dax: IF(COUNTROWS(VALUES('Claim Vessels'[Claim Currency])) = 1, SUM('Claim Vessels'[Incurred Amount]))
    description: Sum of incurred_amount (ROW); blank unless one currency is in context; no FX.
    formatString: '#,##0.00'
    displayFolder: Amounts
    table: Claim Vessels
  Total Paid:
    dax: IF(COUNTROWS(VALUES('Claim Vessels'[Claim Currency])) = 1, SUM('Claim Vessels'[Paid Amount]))
    description: Sum of paid_amount (ROW); blank unless one currency is in context; no FX.
    formatString: '#,##0.00'
    displayFolder: Amounts
    table: Claim Vessels
  Total Salvage:
    dax: IF(COUNTROWS(VALUES('Claim Vessels'[Claim Currency])) = 1, SUM('Claim Vessels'[Salvage Amount]))
    description: Sum of salvage_amount (ROW); blank unless one currency is in context; no FX.
    formatString: '#,##0.00'
    displayFolder: Amounts
    table: Claim Vessels
  Average Claim Reporting Lag (Days):
    dax: AVERAGE('Claim Vessels'[Claim Reporting Lag Days])
    description: 'KPI-REPORTING-LAG: average of claim_reporting_lag_days; never summed.'
    formatString: '#,##0'
    displayFolder: Durations
    table: Claim Vessels
  Minimum Claim Reporting Lag (Days):
    dax: MIN('Claim Vessels'[Claim Reporting Lag Days])
    description: 'KPI-REPORTING-LAG: minimum of claim_reporting_lag_days; never summed.'
    formatString: '#,##0'
    displayFolder: Durations
    table: Claim Vessels
  Maximum Claim Reporting Lag (Days):
    dax: MAX('Claim Vessels'[Claim Reporting Lag Days])
    description: 'KPI-REPORTING-LAG: maximum of claim_reporting_lag_days; never summed.'
    formatString: '#,##0'
    displayFolder: Durations
    table: Claim Vessels
  Claim Payment Ratio (%):
    dax: IF(COUNTROWS(VALUES('Claim Vessels'[Claim Currency])) = 1, DIVIDE(CALCULATE(SUM('Claim Vessels'[Paid Amount]), NOT
      ISBLANK('Claim Vessels'[Claim Payment Ratio])), CALCULATE(SUM('Claim Vessels'[Incurred Amount]), NOT ISBLANK('Claim
      Vessels'[Claim Payment Ratio]))))
    description: 'KPI-PAYMENT-RATIO: DIVIDE(sum paid_amount, sum incurred_amount) over rows where the ratio is valid; never
      summed or averaged.'
    formatString: 0.00%
    displayFolder: Ratios
    table: Claim Vessels
  Claim Settlement Ratio (%):
    dax: IF(COUNTROWS(VALUES('Claim Vessels'[Claim Currency])) = 1, DIVIDE(SUMX(FILTER('Claim Vessels', NOT ISBLANK('Claim
      Vessels'[Claim Settlement Ratio])), 'Claim Vessels'[Claim Settlement Ratio] * 'Claim Vessels'[Incurred Amount]), CALCULATE(SUM('Claim
      Vessels'[Incurred Amount]), NOT ISBLANK('Claim Vessels'[Claim Settlement Ratio]))))
    description: 'KPI-SETTLEMENT-RATIO: DIVIDE(sum _tmp_settlement_total, sum incurred_amount) over rows where the ratio is
      valid; never summed or averaged.'
    formatString: 0.00%
    displayFolder: Ratios
    table: Claim Vessels
  Total Paid to Date:
    dax: IF(COUNTROWS(VALUES('Claim Vessels'[Claim Currency])) = 1, SUM('Claim Vessels'[Paid to Date]))
    description: 'MAR2-09b: sum of paid_to_date; blank unless one currency is in context.'
    formatString: '#,##0.00'
    displayFolder: Amounts
    table: Claim Vessels
  Total Outstanding:
    dax: IF(COUNTROWS(VALUES('Claim Vessels'[Claim Currency])) = 1, SUM('Claim Vessels'[Outstanding Amount]))
    description: 'MAR2-09b: sum of outstanding_amount; blank unless one currency is in context.'
    formatString: '#,##0.00'
    displayFolder: Amounts
    table: Claim Vessels
  '# Claim Vessels (by Notification Date)':
    dax: CALCULATE(COUNTROWS('Claim Vessels'), USERELATIONSHIP('Claim Vessels'[Notification Date Key], 'Date'[Date Key]))
    description: Rows of Claim Vessels dated by Notification Date (inactive role).
    formatString: '#,##0'
    displayFolder: Date roles
    table: Claim Vessels
  Total Incurred (by Notification Date):
    dax: CALCULATE([Total Incurred], USERELATIONSHIP('Claim Vessels'[Notification Date Key], 'Date'[Date Key]))
    description: Total Incurred dated by Notification Date; same currency rule.
    formatString: '#,##0.00'
    displayFolder: Date roles
    table: Claim Vessels
  '# Claims':
    dax: CALCULATE(COUNTROWS('Claim'), 'Claim'[Claim Number] <> "UNKNOWN")
    description: Number of claims, excluding the UNKNOWN member.
    formatString: '#,##0'
    displayFolder: Counts
    table: Claim
  '# Claims (Open Claim)':
    dax: CALCULATE(COUNTROWS('Claim'), 'Claim'[Is Open Claim] = TRUE())
    description: 'KPI-OPEN-REOPENED: claims where is_open_claim is TRUE; NULL is not counted.'
    formatString: '#,##0'
    displayFolder: Indicators
    table: Claim
  '# Claims (Reopened Claim)':
    dax: CALCULATE(COUNTROWS('Claim'), 'Claim'[Is Reopened Claim] = TRUE())
    description: 'KPI-OPEN-REOPENED: claims where is_reopened_claim is TRUE; NULL is not counted.'
    formatString: '#,##0'
    displayFolder: Indicators
    table: Claim
  '# Claims (General Average Declared)':
    dax: CALCULATE(COUNTROWS('Claim'), 'Claim'[General Average Declared] = TRUE())
    description: 'KPI-GA: claims where general_average_declared is TRUE; NULL is not counted.'
    formatString: '#,##0'
    displayFolder: Indicators
    table: Claim
  '# Customers':
    dax: CALCULATE(COUNTROWS('Customer'), 'Customer'[Customer ID] <> "UNKNOWN")
    description: Number of customers, excluding the UNKNOWN member.
    formatString: '#,##0'
    displayFolder: Counts
    table: Customer
  '# Facilities':
    dax: CALCULATE(COUNTROWS('Facility'), 'Facility'[Facility ID] <> "UNKNOWN")
    description: Number of facilities, excluding the UNKNOWN member.
    formatString: '#,##0'
    displayFolder: Counts
    table: Facility
  '# Policy Exposures':
    dax: COUNTROWS('Policy Exposures')
    description: 'Rows of Policy Exposures. Grain: One row per policy (policy_number).'
    formatString: '#,##0'
    displayFolder: Counts
    table: Policy Exposures
  '# Currencies (Policy Exposures)':
    dax: COUNTROWS(VALUES('Policy Exposures'[Currency]))
    description: 'Currency check: currency values in context. Money of Policy Exposures shows only when this is 1.'
    formatString: '#,##0'
    displayFolder: Checks
    table: Policy Exposures
  Total Limit:
    dax: IF(COUNTROWS(VALUES('Policy Exposures'[Currency])) = 1, SUM('Policy Exposures'[Limit Amount]))
    description: Sum of limit_amount (ROW); blank unless one currency is in context; no FX.
    formatString: '#,##0.00'
    displayFolder: Amounts
    table: Policy Exposures
  Total Premium:
    dax: IF(COUNTROWS(VALUES('Policy Exposures'[Currency])) = 1, SUM('Policy Exposures'[Premium Amount]))
    description: Sum of premium_amount (ROW); blank unless one currency is in context; no FX.
    formatString: '#,##0.00'
    displayFolder: Amounts
    table: Policy Exposures
  Total Insured Value (GBP):
    dax: SUM('Policy Exposures'[Insured Value (GBP)])
    description: Sum of insured_value_gbp (ROW); in GBP; never mixed.
    formatString: '#,##0.00'
    displayFolder: Amounts
    table: Policy Exposures
  Total Gross Tonnage:
    dax: SUM('Policy Exposures'[Gross Tonnage])
    description: Sum of gross_tonnage (ROW); not money.
    formatString: '#,##0.00'
    displayFolder: Amounts
    table: Policy Exposures
  '# Policy Exposures (by Insurance Period End)':
    dax: CALCULATE(COUNTROWS('Policy Exposures'), USERELATIONSHIP('Policy Exposures'[Insurance Period End Key], 'Date'[Date
      Key]))
    description: Rows of Policy Exposures dated by Insurance Period End (inactive role).
    formatString: '#,##0'
    displayFolder: Date roles
    table: Policy Exposures
  Total Limit (by Insurance Period End):
    dax: CALCULATE([Total Limit], USERELATIONSHIP('Policy Exposures'[Insurance Period End Key], 'Date'[Date Key]))
    description: Total Limit dated by Insurance Period End; same currency rule.
    formatString: '#,##0.00'
    displayFolder: Date roles
    table: Policy Exposures
  '# Policy Exposures (by Policy Issue Date)':
    dax: CALCULATE(COUNTROWS('Policy Exposures'), USERELATIONSHIP('Policy Exposures'[Policy Issue Date Key], 'Date'[Date Key]))
    description: Rows of Policy Exposures dated by Policy Issue Date (inactive role).
    formatString: '#,##0'
    displayFolder: Date roles
    table: Policy Exposures
  Total Limit (by Policy Issue Date):
    dax: CALCULATE([Total Limit], USERELATIONSHIP('Policy Exposures'[Policy Issue Date Key], 'Date'[Date Key]))
    description: Total Limit dated by Policy Issue Date; same currency rule.
    formatString: '#,##0.00'
    displayFolder: Date roles
    table: Policy Exposures
  '# Policies':
    dax: CALCULATE(COUNTROWS('Policy'), 'Policy'[Policy Number] <> "UNKNOWN")
    description: Number of policies, excluding the UNKNOWN member.
    formatString: '#,##0'
    displayFolder: Counts
    table: Policy
  Average Policy Duration (Days):
    dax: AVERAGE('Policy'[Policy Duration Days])
    description: 'KPI-POLICY-DURATION: average of policy_duration_days; day counts are never summed.'
    formatString: '#,##0'
    displayFolder: Durations
    table: Policy
  Minimum Policy Duration (Days):
    dax: MIN('Policy'[Policy Duration Days])
    description: 'KPI-POLICY-DURATION: minimum of policy_duration_days; day counts are never summed.'
    formatString: '#,##0'
    displayFolder: Durations
    table: Policy
  Maximum Policy Duration (Days):
    dax: MAX('Policy'[Policy Duration Days])
    description: 'KPI-POLICY-DURATION: maximum of policy_duration_days; day counts are never summed.'
    formatString: '#,##0'
    displayFolder: Durations
    table: Policy
  '# Policies (War Risk Included)':
    dax: CALCULATE(COUNTROWS('Policy'), 'Policy'[War Risk Included] = TRUE())
    description: 'KPI-WAR-RISK: policies where war_risk_included is TRUE; NULL is not counted.'
    formatString: '#,##0'
    displayFolder: Indicators
    table: Policy
  '# Vessels':
    dax: CALCULATE(COUNTROWS('Vessel'), 'Vessel'[IMO Number] <> "UNKNOWN")
    description: Number of vessels, excluding the UNKNOWN member.
    formatString: '#,##0'
    displayFolder: Counts
    table: Vessel
